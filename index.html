<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>

    <header>
        <h1>Student Registration Form</h1>
    </header>

    <main>
        <form action="#" method="post">

            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" placeholder="John Doe" required>

            <br><br>

            <label for="matricnumber">Matric Number:</label>
            <input type="number" id="matricnumber" name="matricnumber" placeholder="20241234" required>

            <br><br>

            <label for="department">Department:</label>
            <select name="department" id="department" required>
                <option value="">Select Department</option>
                <option value="ICT">Infornation Communication Technology</option>
                <option value="CSC">Computer Science</option>
                <option value="CYB">Cyber Security</option>
                <option value="SWE">Software Enginnering</option>
                <option value="DSC">Data Science</option>
                <option value="IFS">Infornation Systems</option>
                <option value="IFT">Infornation Technology</option>
            </select>

            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="johndoe@gmail.com" required>

            <br><br>

            <label for="phone">Phone No:</label>
            <input type="tel" id="phone" name="phone" placeholder="09027346518" required>

            <br>

            <p>Select Gender:</p>
            <label for="">
                <input type="radio" name="gender" value="male">
                Male
            </label>
            <label for="">
                <input type="radio" name="gender" value="female">
                Female
            </label>

            <br><br>

            <label for="programme">Programme</label>
            <select name="programme" id="programme" required>
                <option value="">Select Programme</option>
                <option value="FT">Full-time</option>
                <option value="WD">Weekday</option>
                <option value="WE">Weekend</option>
            </select>

            <br><br>

            <button type="submit">Submit</button>

        </form>
    </main>
</body>
</html>
